<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11A69C">
<title>Painel Studio Thiago Santos</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 640 640%22%3E%3Crect width=%22640%22 height=%22640%22 rx=%22140%22 fill=%22%23fff%22/%3E%3Cg transform=%22translate%2870 60%29 scale%280.9%29%22%3E%3Cg transform=%22translate%28-70 -80%29%22%3E%3Cpath fill=%22%2311A69C%22 d=%22M318 104C290 90 260 100 235 125C150 200 95 300 93 400C92 480 140 560 185 615C200 630 220 616 214 595C208 550 198 505 215 462C228 485 255 525 285 556C298 566 306 550 298 535C302 480 305 400 300 330C270 290 240 250 248 215C255 172 290 150 322 130C332 120 329 108 318 104Z%22/%3E%3Ccircle fill=%22%2311A69C%22 cx=%22362%22 cy=%22232%22 r=%2246%22/%3E%3Cpath fill=%22%23406EC1%22 d=%22M462 232C440 220 410 235 385 262C330 320 280 370 273 430C270 500 290 570 312 600C322 614 344 603 340 585C337 550 335 520 350 490C370 522 400 566 425 584C441 592 454 576 441 555C422 515 412 482 407 457C440 464 490 470 515 463C535 456 531 436 511 428C470 415 430 402 407 386C402 345 422 305 452 272C470 255 476 240 462 232Z%22/%3E%3Ccircle fill=%22%23406EC1%22 cx=%22480%22 cy=%22337%22 r=%2235%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Direção: painel claro e arejado, verde-azulado do studio como acento, vermelho/âmbar só para estado.
   Layout: menu lateral no notebook, barra inferior no celular, tudo em cards clicáveis. */
:root{
  --bg:#F4F4F5; --surface:#ffffff; --surface-2:#f7f7f8; --ink:#14262e; --muted:#5d6e77; --line:#EAE9EB;
  --brand:#11A69C; --brand-ink:#0b766f; --brand-soft:#dcf3f1;
  --good:#4f8a17; --good-fill:#8DC53E; --good-soft:#eaf5d9; --warn:#b97300; --warn-soft:#fdf0d5; --bad:#B20042; --bad-soft:#fde3ec; --info:#406EC1; --info-soft:#e5ecf8;
  --s1:#11A69C; --s2:#406EC1; --s3:#e8a317; --s4:#FF3981; --s5:#127BBA; --s6:#9aa3ab; --s7:#8DC53E; --s8:#3DA9B4;
  --plan:#10282f; --shadow:0 1px 2px rgba(16,40,47,.05),0 6px 18px rgba(16,40,47,.04);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1a1f; --surface:#112328; --surface-2:#0e1f24; --ink:#e8f3f4; --muted:#8fa9b0; --line:#1f3a41;
    --brand:#2BC7BB; --brand-ink:#7fe3da; --brand-soft:#123b3c;
    --good:#a6dc62; --good-fill:#8DC53E; --good-soft:#243511; --warn:#f0b43c; --warn-soft:#3b2d0c; --bad:#FF3981; --bad-soft:#3d1426; --info:#7fa3ec; --info-soft:#1a2a4a;
    --s1:#2BC7BB; --s2:#6f93e0; --s3:#f0b43c; --s4:#FF3981; --s5:#4ba6e0; --s6:#8fa4ac; --s7:#a5d95e; --s8:#5cc2cc;
    --plan:#e8f3f4; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1a1f; --surface:#112328; --surface-2:#0e1f24; --ink:#e8f3f4; --muted:#8fa9b0; --line:#1f3a41;
  --brand:#2BC7BB; --brand-ink:#7fe3da; --brand-soft:#123b3c;
  --good:#a6dc62; --good-fill:#8DC53E; --good-soft:#243511; --warn:#f0b43c; --warn-soft:#3b2d0c; --bad:#FF3981; --bad-soft:#3d1426; --info:#7fa3ec; --info-soft:#1a2a4a;
  --s1:#2BC7BB; --s2:#6f93e0; --s3:#f0b43c; --s4:#FF3981; --s5:#4ba6e0; --s6:#8fa4ac; --s7:#a5d95e; --s8:#5cc2cc;
  --plan:#e8f3f4; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0;text-wrap:balance}
.i{width:20px;height:20px;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}

/* estrutura */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.mark{width:44px;height:44px;border-radius:13px;background:var(--surface);border:1px solid var(--line);padding:5px;display:grid;place-items:center;flex:none}
.logo{display:block;width:100%;height:100%}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-ink)}
.badge{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font-size:12px;font-weight:700;text-align:center}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.info{background:var(--info-soft);color:var(--info)}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--line);font-size:12px;color:var(--muted)}
.side-foot b{color:var(--ink)}

.main{padding:26px 32px 56px;min-width:0}
.wrap{max-width:1260px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top-l{display:flex;align-items:center;gap:12px;min-width:0}
.top-l .mark{display:none}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--ink)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);padding:6px;display:grid;place-items:center}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
a.card{display:block;transition:transform .15s,border-color .15s,box-shadow .15s}
a.card:hover{transform:translateY(-2px);border-color:var(--brand)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.ct{font-weight:700;font-size:15px}
.cs{color:var(--muted);font-size:12.5px;margin-top:2px}
.go{width:28px;height:28px;border-radius:9px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none}
a.card:hover .go{background:var(--brand);color:#fff}
.go .i{width:15px;height:15px}
.grid{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.mute{background:var(--surface-2);color:var(--muted)}

/* resumo */
.summary{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.sum-text{display:flex;flex-direction:column;gap:8px;background:linear-gradient(135deg,var(--brand-soft),var(--surface));}
.sum-text .eyebrow{color:var(--brand-ink)}
.sum-text p{font-size:17px;line-height:1.5;font-weight:600}
.sum-text p em{font-style:normal;color:var(--brand-ink)}
.health{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.h-item{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.h-item small{color:var(--muted);font-size:12px}
.h-item b{font-size:14px;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.good{background:var(--good-fill)}.dot.warn{background:var(--s3)}.dot.bad{background:var(--bad)}

/* alertas */
#view{display:flex;flex-direction:column;gap:16px}
.sec-t{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:10px 0 -4px}
.sum-text{justify-content:center}
.weeks{display:flex;align-items:flex-end;gap:8px;height:64px;margin-top:6px}
.weeks div{flex:1;border-radius:6px 6px 3px 3px;background:var(--brand);opacity:.35;min-height:6px}
.weeks div:last-child{opacity:1}
.weeks-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.alerts{grid-template-columns:repeat(4,minmax(0,1fr))}
a.card.alert{display:flex;gap:12px;align-items:center;position:relative;padding:16px 16px 16px 20px;overflow:hidden}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.alert.bad{--c:var(--bad)}.alert.warn{--c:var(--s3)}.alert.info{--c:var(--info)}
.alert .n{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em}
.alert .t{font-size:13px;color:var(--muted);line-height:1.3}
.alert .t b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.alert .go{margin-left:auto}

/* kpis */
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
a.card.kpi{display:flex;flex-direction:column;gap:6px;padding:16px}
.kpi-h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600}
.kpi-h .i{width:18px;height:18px;color:var(--brand)}
.kpi-h .i.neg{color:var(--bad)}
.kpi-h .go{margin-left:auto}
.kpi-v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi-v small{font-size:14px;color:var(--muted);font-weight:600;letter-spacing:0}
.kpi-s{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:12.5px}
.spark{width:100%;height:34px;margin-top:2px;display:block}
.bar-track{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--brand)}
.bar-fill.warn{background:var(--s3)}.bar-fill.bad{background:var(--bad)}

/* gráficos */
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.chart{display:block;max-width:100%;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .bar{fill:var(--brand);transition:opacity .15s}
.chart .bar.partial{opacity:.5}
.chart .bar.out{fill:var(--s4)}
.chart .plan{fill:none;stroke:var(--plan);stroke-width:2;stroke-dasharray:5 4}
.chart .pt{fill:var(--surface);stroke:var(--plan);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:var(--brand);fill-opacity:.07}
.chart .line{fill:none;stroke:var(--brand);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .center-n{fill:var(--ink);font-size:24px;font-weight:800;font-family:var(--font)}
.chart .center-s{fill:var(--muted);font-size:11.5px;font-family:var(--font)}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.lg{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;font-size:13px}
a.lg:hover{background:var(--surface-2)}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg span:nth-of-type(1){flex:1;min-width:0}
.lg b{font-weight:700}
.lg small{color:var(--muted);width:40px;text-align:right}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:3px}
.key i.dash{height:0;width:16px;border-top:2px dashed var(--plan);border-radius:0}
.split{display:flex;gap:6px;height:16px;border-radius:99px;overflow:hidden}
.split a{display:block;min-width:6px}
.split a:hover{opacity:.8}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:6px 8px;margin:0 -8px;border-radius:10px;align-items:center}
a.row:hover{background:var(--surface-2)}
.row .lab{font-size:13.5px;font-weight:600}
.row .val{font-size:13px;color:var(--muted);text-align:right}
.row .val b{color:var(--ink)}
.row .bar-track{grid-column:1/-1}
.heat{display:grid;grid-template-columns:34px repeat(10,minmax(0,1fr));gap:4px;align-items:center}
.heat .h{font-size:11px;color:var(--muted);text-align:center}
.heat .d{font-size:12px;color:var(--muted);font-weight:600}
.cell{height:30px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink);cursor:default}
.cell.off{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 7px)}
.heat-leg{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.heat-leg i{display:block;width:90px;height:8px;border-radius:99px;background:linear-gradient(90deg,rgba(17,166,156,.08),rgba(17,166,156,.95))}
.insight{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.insight b{color:var(--ink)}
.today-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.today-row:first-of-type{border-top:0}
.today-row .hh{font-weight:800}
.today-row small{display:block;color:var(--muted);font-size:12px}
.ring-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mini-stats{display:flex;flex-direction:column;gap:6px;font-size:13px;flex:1;min-width:150px}
.mini-stats a{display:block}
.mini-stats a:hover{color:var(--brand-ink)}
.mini-stats div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.mini-stats > :last-child{border-bottom:0}
.mini-stats b{font-weight:700}
.partners{display:flex;flex-direction:column;gap:2px}
.partners div{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;font-weight:600;border-top:1px solid var(--line)}
.partners div:first-child{border-top:0}
.foot{color:var(--muted);font-size:12px;text-align:center;padding-top:8px}

/* placeholder das outras telas */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--brand-ink);font-size:14px}
.back .i{width:16px;height:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.skel{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.skel div{height:38px;border-radius:10px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 2.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.todo{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.todo li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none}
code.route{background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:8px;font-size:12.5px}

/* dica flutuante */
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:10px;font-size:12.5px;font-weight:600;max-width:240px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tip.on{opacity:1;transform:none}

/* barra inferior (celular) */
.tabbar{display:none}
.sheet{display:none}

@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1100px){
  .c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .alerts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summary{grid-template-columns:1fr}
}
@media (max-width:899px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 16px 110px}
  .top-l .mark{display:grid;width:40px;height:40px;border-radius:12px;padding:5px}
  h1{font-size:23px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;border-radius:12px;position:relative;cursor:pointer}
  .tabbar .on{color:var(--brand-ink);background:var(--brand-soft)}
  .tabbar .badge{position:absolute;top:2px;right:calc(50% - 22px);margin:0;min-width:18px;padding:0 5px;font-size:10.5px}
  .sheet{position:fixed;inset:0;z-index:50;background:rgba(7,20,24,.5);align-items:flex-end}
  .sheet.on{display:flex}
  .sheet-in{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px}
  .sheet-in a,.sheet-in button{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:12px;font-weight:700;border:0;background:none;text-align:left;cursor:pointer}
  .sheet-in a:hover,.sheet-in button:hover{background:var(--surface-2)}
  .grip{width:42px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px}
}
@media (max-width:640px){
  .c3{grid-column:span 12}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-v{font-size:25px}
  a.card.alert{padding:14px 12px 14px 16px;gap:10px}
  .alert .n{font-size:26px}
  .alert .go{display:none}
  .top-r .seg{order:3}
  .health{grid-template-columns:1fr 1fr}
  .sum-text p{font-size:15.5px}
  .card{padding:15px;border-radius:16px}
  .cell{height:26px;font-size:0}
}
@media (max-width:380px){
  .alerts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

function sparkline(vals,color){
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals), n=vals.length;

  var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
  return '<svg class="spark" viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+d+' L100 32 L0 32 Z" fill="'+color+'" fill-opacity=".12"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

}

/* ---------- desenho dos gráficos ---------- */
function drawRevenue(){
  var el=document.getElementById('ch-rev'); if(!el)return;
  var n=state.range, lab=ML.slice(-n), yr=MY.slice(-n), rec=recebido.slice(-n), prev=previsto.slice(-n);
  var w=Math.max(280,el.clientWidth), h=w<520?230:(w<560?290:390), m={l:36,r:8,t:12,b:26};
  var iw=w-m.l-m.r, ih=h-m.t-m.b, max=70000;
  function y(v){return m.t+ih-(v/max)*ih}
  var band=iw/n, bw=Math.min(36,band*.58), s='';
  [0,20000,40000,60000].forEach(function(t){
    s+='<line class="grid-l" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text class="axis" x="'+(m.l-8)+'" y="'+(y(t)+4)+'" text-anchor="end">'+(t/1000)+'</text>';
  });
  var pts=[];
  for(var i=0;i<n;i++){
    var cx=m.l+band*i+band/2, partial=(i===n-1), top=y(rec[i]);
    var tip=lab[i]+'/'+yr[i]+': recebido '+brl(rec[i])+' de '+brl(prev[i])+' ('+pct(rec[i],prev[i])+')'+(partial?', mês em andamento':'');
    s+='<rect class="bar'+(partial?' partial':'')+'" x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+(y(0)-top)+'" rx="6" data-tip="'+esc(tip)+'"/>';
    pts.push([cx,y(prev[i])]);
    if(n<12||i%2===(n-1)%2||w>520) s+='<text class="axis" x="'+cx+'" y="'+(h-8)+'" text-anchor="middle">'+lab[i]+'</text>';
  }
  s+='<path class="plan" d="'+pts.map(function(p,i){return (i?'L':'M')+p[0]+' '+p[1]}).join(' ')+'"/>';
  pts.forEach(function(p,i){s+='<circle class="pt" cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===n-1?5:3.2)+'"/>'});
  var last=pts[n-1];
  s+='<text class="axis" x="'+(last[0])+'" y="'+(last[1]-12)+'" text-anchor="end" style="font-weight:700;fill:var(--ink)">'+mil(prev[n-1])+'</text>';
  el.innerHTML='<svg class="chart" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Receita prevista e recebida por mês">'+s+'</svg>';
}

function drawClients(){
  var el=document.getElementById('ch-cli'); if(!el)return;
  var n=state.range, lab=ML.slice(-n), yr=MY.slice(-n), at=ativos.slice(-n), en=entradas.slice(-n), sa=saidas.slice(-n);
  var w=Math.max(280,el.clientWidth), m={l:30,r:10,t:14,b:22};
  var h1=w<520?130:160, gap=16, h2=64, h=m.t+h1+gap+h2+m.b;
  var iw=w-m.l-m.r, band=iw/n;
  var minA=Math.floor((Math.min.apply(null,at)-3)/5)*5, maxA=Math.ceil((Math.max.apply(null,at)+3)/5)*5;
  var ticksA=[minA,Math.round((minA+maxA)/2),maxA];
  function ya(v){return m.t+h1-((v-minA)/(maxA-minA))*h1}
  var s='<defs><linearGradient id="g-cli" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".28"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>';
  ticksA.forEach(function(t){s+='<line class="grid-l" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+ya(t)+'" y2="'+ya(t)+'"/><text class="axis" x="'+(m.l-8)+'" y="'+(ya(t)+4)+'" text-anchor="end">'+t+'</text>'});
  var pts=at.map(function(v,i){return [m.l+band*i+band/2, ya(v)]});
  var d=pts.map(function(p,i){return (i?'L':'M')+p[0]+' '+p[1]}).join(' ');
  s+='<path d="'+d+' L'+pts[n-1][0]+' '+(m.t+h1)+' L'+pts[0][0]+' '+(m.t+h1)+' Z" fill="url(#g-cli)"/><path class="line" d="'+d+'"/>';
  pts.forEach(function(p,i){ if(i<n-1) s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" style="fill:var(--surface);stroke:var(--brand);stroke-width:2"/>'});
  var L=pts[n-1];
  s+='<circle cx="'+L[0]+'" cy="'+L[1]+'" r="9" style="fill:var(--brand);fill-opacity:.18"/><circle cx="'+L[0]+'" cy="'+L[1]+'" r="5" style="fill:var(--brand)"/>'+
     '<text class="axis" x="'+L[0]+'" y="'+(L[1]-14)+'" text-anchor="end" style="font-weight:800;font-size:13px;fill:var(--ink)">'+at[n-1]+'</text>';
  var base=m.t+h1+gap+h2/2, sc=(h2/2-4)/7, bw=Math.min(26,band*.5);
  s+='<line class="grid-l" x1="'+m.l+'" x2="'+(w-m.r)+'" y1="'+base+'" y2="'+base+'"/>';
  for(var i=0;i<n;i++){
    var cx=m.l+band*i+band/2;
    s+='<rect class="bar" x="'+(cx-bw/2)+'" y="'+(base-en[i]*sc)+'" width="'+bw+'" height="'+(en[i]*sc)+'" rx="4"/>'+
       '<rect class="bar out" x="'+(cx-bw/2)+'" y="'+base+'" width="'+bw+'" height="'+(sa[i]*sc)+'" rx="4"/>';
    s+='<rect class="hit" x="'+(cx-band/2)+'" y="'+m.t+'" width="'+band+'" height="'+(h1+gap+h2)+'" data-tip="'+esc(lab[i]+'/'+yr[i]+': '+at[i]+' ativos, '+en[i]+' entradas, '+sa[i]+' saídas')+'"/>';
    if(n<12||i%2===(n-1)%2||w>520) s+='<text class="axis" x="'+cx+'" y="'+(h-6)+'" text-anchor="middle">'+lab[i]+'</text>';
  }
  el.innerHTML='<svg class="chart" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Clientes ativos, entradas e saídas por mês">'+s+'</svg>';
}

/* ---------- tema ---------- */
function effectiveTheme(){
  var t=document.documentElement.getAttribute('data-theme');
  if(t) return t;
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function toggleTheme(){
  var next=effectiveTheme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('tema',next)}catch(e){}
  render();
}
try{var saved=localStorage.getItem('tema'); if(saved) document.documentElement.setAttribute('data-theme',saved)}catch(e){}

/* ---------- sheet ---------- */
function closeSheet(){document.getElementById('sheet').classList.remove('on')}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var t=ev.target;
  var a=t.closest&&t.closest('a[href^="#"]');
  if(a){
    state.filter=a.getAttribute('data-f')||'';
    var dest=a.getAttribute('href').slice(1);
    if(dest===state.route||(!location.hash&&dest==='painel')){ev.preventDefault();setRoute()}
    return;
  }
  var rb=t.closest&&t.closest('[data-range]');
  if(rb){state.range=parseInt(rb.getAttribute('data-range'),10);render();return}
  if(t.closest&&t.closest('[data-theme-toggle]')){toggleTheme();return}
  if(t.closest&&t.closest('[data-sheet]')){document.getElementById('sheet').classList.add('on');return}
  if(t.id==='sheet') closeSheet();
});
window.addEventListener('hashchange',setRoute);

/* dica flutuante */
var tip=document.getElementById('tip');
function showTip(el,x,y){
  tip.textContent=el.getAttribute('data-tip'); tip.classList.add('on');
  var w=tip.offsetWidth,h=tip.offsetHeight;
  var nx=Math.min(Math.max(8,x+14),window.innerWidth-w-8), ny=y-h-14; if(ny<8) ny=y+18;
  tip.style.left=nx+'px'; tip.style.top=ny+'px';
}
document.addEventListener('pointermove',function(ev){var el=ev.target.closest&&ev.target.closest('[data-tip]'); if(el) showTip(el,ev.clientX,ev.clientY); else tip.classList.remove('on')});
document.addEventListener('pointerdown',function(ev){var el=ev.target.closest&&ev.target.closest('[data-tip]'); if(el) showTip(el,ev.clientX,ev.clientY); else tip.classList.remove('on')});
document.addEventListener('pointerleave',function(){tip.classList.remove('on')});
window.addEventListener('scroll',function(){tip.classList.remove('on')},{passive:true});

/* redesenha os gráficos quando a largura muda */
var rt=null, lastW=0;
if(window.ResizeObserver){
  new ResizeObserver(function(){
    var w=document.getElementById('view').clientWidth;
    if(w===lastW) return; lastW=w;
    clearTimeout(rt); rt=setTimeout(function(){if(state.route==='painel')drawAll()},80);
  }).observe(document.getElementById('view'));
}

setRoute();
})();
</script>
</body>
